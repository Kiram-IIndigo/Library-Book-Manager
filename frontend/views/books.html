<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Books</h1>
  <button

    data-bs-toggle="modal"
    data-bs-target="#addModal"
  >
    Add book
  </button>
</div>

    <table class="table mb-0">
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Available</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Dune</td>
          <td>Frank Herbert</td>
          <td>Science fiction</td>
          <td>3</td>
          <td class="text-end">
            <button
              class="btn btn-sm btn-outline-secondary"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Edit
            </button>
            <button
              class="btn btn-sm btn-outline-danger"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Delete
            </button>
          </td>
        </tr>
        <tr>
          <td>Beloved</td>
          <td>Toni Morrison</td>
          <td>Fiction</td>
          <td>1</td>
          <td class="text-end">
            <button
              class="btn btn-sm btn-outline-secondary"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Edit
            </button>
            <button
              class="btn btn-sm btn-outline-danger"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Delete
            </button>
          </td>
        </tr>
        <tr>
          <td>The Bridge on the Drina</td>
          <td>Ivo Andrić</td>
          <td>Historical</td>
          <td>2</td>
          <td class="text-end">
            <button
              class="btn btn-sm btn-outline-secondary"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Edit
            </button>
            <button
              class="btn btn-sm btn-outline-danger"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5">Add book</h2>
        <button
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="api-slot mb-3">
          <strong>Open Library lookup (external API)</strong>
          <p class="small mb-2">
            Enter an ISBN to fill in the cover, description and page count
            automatically.
          </p>
          <div class="input-group">
            <input class="form-control" placeholder="ISBN" /><button
              class="btn btn-outline-secondary"
              type="button"
              title="Placeholder: connected to the backend in Milestone 4"
            >
              Look up
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Title</label><input class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Author</label><input class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label
          ><input class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Pages</label><input class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Copies available</label
          ><input class="form-control" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button
        ><button
          class="btn btn-primary"
          data-bs-dismiss="modal"
          title="Placeholder: connected to the backend in Milestone 4"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</div>
